# Copy this file to strat-echo.toml to make it the default configuration,
# or pass it explicitly with: strat-echo backtest --config path/to/file.toml

[backtest]
symbol = "SPY"
years = 5
# Dates must be quoted because the CLI expects the YYYY-MM-DD string format.
# start = "2021-01-01"
# end = "2026-01-01"

source = "csv"
csv_path = "data/SPY.csv"
# With no explicit dates, start at the CSV's first candle and add `years`.
# Use "end-today" to end today, or "end-csv" to end at the final CSV
# candle; both alternatives subtract `years` to derive the start.
csv_period_anchor = "start-csv"
initial_capital = 10000.0
# Optionally save the backtest dashboard. The file must not already exist.
# chart = "reports/backtest-dashboard.png"

sizing = "percent"
buy_percent = 0.5
sell_percent = 1.0
# Optionally wrap buy quantity resolution with a cash reserve. Affordability
# still uses the configured commission and slippage models.
buffer_rate = 0.01
# For fixed sizing, replace sizing and the two percentage settings with:
# sizing = "fixed"
# buy_size = 10
# sell_size = 10

commission_model = "proportional"
commission_rate = 0.001
# For a fixed commission, replace the two settings above with:
# commission_model = "fixed"
# fixed_commission = 2.50
slippage_rate = 0.0005

# See docs/strategies.md for every canonical strategy name and its parameters.
strategy = "simple-moving-average"
short_window = 20
long_window = 50
rsi_period = 14
rsi_min = 30.0
rsi_max = 70.0
mean_window = 20
mean_threshold = 0.95
# Donchian breakout defaults; used when strategy = "donchian-breakout".
entry_window = 20
exit_window = 10

[compare]
benchmark = "buy-and-hold"
# Optional comparison dashboard output (independent of [backtest].chart).
# chart = "reports/comparison-dashboard.png"
